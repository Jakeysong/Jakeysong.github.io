baseURL: "https://<你的github用户名>.github.io/"
title: "学习笔记"
theme: "PaperMod"

locale: "zh-cn"
hasCJKLanguage: true
enableRobotsTXT: true
enableEmoji: true

paginate: 10

params:
  env: production
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true

  homeInfoParams:
    Title: "欢迎来到我的博客 👋"
    Content: "这里记录我的学习笔记、读书心得和技术总结。"

  socialIcons:
    - name: github
      url: "https://github.com/<你的github用户名>"

  editPost:
    URL: "https://github.com/<你的github用户名>/<仓库名>/edit/main/content"
    Text: "编辑本文"
    appendFilePath: true

menu:
  main:
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: search
      name: 搜索
      url: /search/
      weight: 30
